[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# --proxy-headers + --forwarded-allow-ips='*' — Railway terminates TLS at its
# own edge and proxies every request to this container over its internal
# network, so without this uvicorn sees Railway's proxy IP as request.client
# for every single request, not the real visitor's. That breaks slowapi's
# per-IP rate limiting (keyed on request.client.host) — it ends up sharing
# one bucket across all traffic instead of limiting each visitor separately —
# and makes IP-based request logging useless. '*' is safe here specifically
# because the app is only reachable via Railway's edge, never directly.
startCommand = "uvicorn server:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips='*'"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
